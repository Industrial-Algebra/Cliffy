[package]
name = "cliffy-core"
version = "0.3.1"
edition = "2021"
description = "Reactive UI framework with geometric algebra state management"
license = "Apache-2.0"
repository = "https://github.com/Industrial-Algebra/Cliffy"
readme = "README.md"
keywords = ["reactive", "frp", "geometric-algebra", "ui", "wasm"]
categories = ["gui", "wasm", "mathematics"]

[dependencies]
parking_lot = "0.12"
# Amari provides geometric algebra
amari-core = { workspace = true }

# Serialization
serde = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
